services:
  backend:
    image: test_backend_2
    build: 
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3000:3000

  frontend:
    image: test_frontend_2
    build:
      context: ./frontend
    ports:
      - "5173:5173" 
    depends_on:
      - backend

  db:
    image: test_postgres_db_2
    build:
        context: ./db
    # перемернные окружения контейнера
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5